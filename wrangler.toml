name = "aps"
main = "build/index.js"
compatibility_date = "2026-09-19"

routes = [
  { pattern = "api.xivlabs.tech", custom_domain = true }
]

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

[[d1_databases]]
binding = "phishing_db"
database_name = "phishing-db"
database_id = "3e092132-26aa-46dc-817b-a6d517b16743"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "14e2750166bc4cf89cd48766b57d8e72"

# /scan limits per client (IPv4 address or IPv6 /64). period must be 10 or 60.
[[ratelimits]]
name = "SCAN_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "DEMO_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
